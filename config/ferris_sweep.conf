# Ferris Sweep ZMK Kconfig overrides
#
# Shared config for both left and right halves.
# Split role (central/peripheral) is assigned per-half at build time.

# Enable deep sleep for battery-powered nice_nano operation
CONFIG_ZMK_SLEEP=y

# Set keyboard name for BLE identification (max 16 chars)
CONFIG_ZMK_KEYBOARD_NAME="Ferris Sweep"

# Ferris Sweep PCB has no RGB underglow — disable explicitly
CONFIG_ZMK_RGB_UNDERGLOW=n

# Ferris Sweep PCB has no backlight — disable explicitly
CONFIG_ZMK_BACKLIGHT=n

# Enter deep sleep after 30 minutes of inactivity (1800000 ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Increase bluetooth signal power
CONFIG_BT_GATT_AUTO_SEC_REQ=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
